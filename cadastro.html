<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto TotemAssist</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts: Radley -->
    <link href="https://fonts.googleapis.com/css2?family=Radley&display=swap" rel="stylesheet">
    <style>
        html {
            height: 100%;
        }
        body {
            font-family: 'Radley', serif;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand, .nav-link, .btn, label {
            font-family: 'Radley', serif;
        }
        .login-container {
            max-width: 500px;
            margin: auto;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light" aria-label="Main navigation">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Projeto TotemAssist</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html" id="navInicio">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre_projeto.html" id="navSobre">Sobre o Projeto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre_grupo.html" id="navEquipe">Equipe Responsável</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
        <article class="login-container" role="form" aria-labelledby="cadastro-heading">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4" id="cadastro-heading">Cadastre-se</h2>
                    <form id="cadastroForm">
                        <fieldset>
                            <legend class="visually-hidden">Formulário de Cadastro</legend>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu email" required>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha:</label>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmaSenha" class="form-label">Confirmar Senha:</label>
                                <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha" placeholder="Confirme sua senha" required>
                            </div>
                            <button type="submit" id="btnCadastrar" class="btn btn-primary w-100">Cadastrar</button>
                        </fieldset>
                        <div class="text-center mt-3">
                            <p class="mb-0">Já tem uma conta?</p>
                            <a href="login.html" id="btnLogin" class="text-decoration-none">Faça login aqui</a>
                        </div>
                    </form>
                </div>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="bg-light py-4">
        <div class="container text-center">
            <p class="mb-2">© 2024 Projeto Hospitalar. Todos os direitos reservados.</p>
            <nav aria-label="Footer navigation">
                <ul class="list-inline">
                    <li class="list-inline-item"><a href="#" class="text-decoration-none">Termos de Serviço</a></li>
                    <li class="list-inline-item"><a href="#" class="text-decoration-none">Privacidade</a></li>
                    <li class="list-inline-item"><a href="#" class="text-decoration-none">Ajuda</a></li>
                </ul>
            </nav>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- External JS -->
    <script src="./src/js/cadastro.js"></script>
</body>
</html>
